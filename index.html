<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сибирские сказы | Библиотека</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Большой Header на всю ширину -->
    <header class="hero-header">
        <div class="hero-content">
            <h1>Сибирские сказы</h1>
            <p>Авторский сборник сказок и историй</p>
        </div>
    </header>

    <!-- Основной контент: полка с книгами -->
    <main class="container">
        <h2 class="section-title">Мои произведения</h2>
        
        <!-- Сетка книг -->
        <div class="book-grid">
            
            <!-- Карточка книги 1 -->
            <a href="skazka-1.html" class="book-card">
                <!-- Замените ссылку в src на путь к вашей картинке-обложке -->
                <img src="https://images.unsplash.com/photo-1544947950-fa07a98d237f?q=80&w=600&auto=format&fit=crop" alt="Обложка книги Килковы зори" class="book-cover">
                <div class="book-info">
                    <h3>Килковы зори</h3>
                    <p>Короткое описание этой сказки или первая строка для привлечения внимания.</p>
                </div>
            </a>

            <!-- Карточка книги 2 -->
            <a href="skazka-1.html" class="book-card">
                <img src="https://images.unsplash.com/photo-1512820790803-83ca734da794?q=80&w=600&auto=format&fit=crop" alt="Обложка книги Козлиный лужок" class="book-cover">
                <div class="book-info">
                    <h3>Козлиный лужок</h3>
                    <p>Еще одна интересная история, которую можно прочитать прямо на сайте.</p>
                </div>
            </a>

            <!-- Чтобы добавить новую книгу, просто скопируйте блок <a class="book-card">...</a> и поменяйте текст и картинку -->

        </div>
    </main>

    <!-- Подвал -->
    <footer>
        <p>&copy; 2026 Александр Воронцов. Все права защищены.</p>
    </footer>

</body>
</html>
